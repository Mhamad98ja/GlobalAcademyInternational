services:
  - type: web
    name: sbm-school-book-manager
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: sbm-school-book-manager-db
          property: connectionString
      - key: DB_SSLMODE
        value: prefer
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SBM_ADMIN_NAME
        sync: false
      - key: SBM_ADMIN_EMAIL
        sync: false
      - key: SBM_ADMIN_PASSWORD
        sync: false

databases:
  - name: sbm-school-book-manager-db
    plan: free
    databaseName: sbm
    user: sbm
